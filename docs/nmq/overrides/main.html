{% extends "base.html" %}

{% block fonts %}
  <style>
    body,
    input,
    button,
    select,
    textarea {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", Helvetica, Arial,
        sans-serif;
    }

    code,
    kbd,
    pre {
      font-family: "Cascadia Mono", "SFMono-Regular", Consolas, "Liberation Mono",
        Menlo, monospace;
    }
  </style>
{% endblock %}
